apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ggt-douglas-mogoba/argocd-demo.git
    targetRevision: HEAD

    path: apps/backend

    helm:
      valueFiles:
        - ../../environments/dev/backend-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
