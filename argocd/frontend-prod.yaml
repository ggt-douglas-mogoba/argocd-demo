apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ggt-douglas-mogoba/argocd-demo.git
    targetRevision: HEAD

    path: apps/frontend

    helm:
      valueFiles:
        - ../../environments/prod/frontend-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
